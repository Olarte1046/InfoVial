[[redirects]]
  from = "/u/:slug"
  to = "/u.html?s=:slug"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/legal/terms.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/legal/disclaimer.html"
  status = 200

[[redirects]]
  from = "/data-policy"
  to = "/legal/data-policy.html"
  status = 200

[[redirects]]
  from = "/manual"
  to = "/legal/manual.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
