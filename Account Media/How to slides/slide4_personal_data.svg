        <text x="10" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#121212">+57 321 307 3127</text>
      </g>
      
      <g transform="translate(0, 140)">
        <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">RELACIÓN</text>
        <rect y="10" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1"/>
        <text x="10" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#121212">Novia</text>
      </g>
      
      <!-- Primary Save Button -->
      <g transform="translate(0, 240)">
