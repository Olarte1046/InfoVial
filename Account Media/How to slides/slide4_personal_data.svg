<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#F8FAFC"/>
  <rect x="80" y="200" width="920" height="950" rx="40" fill="#FFFFFF"/>
  <rect x="80" y="200" width="920" height="950" rx="40" fill="none" stroke="#EDF2F7" stroke-width="1"/>
  
  <text x="540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052FF" letter-spacing="0.2em">PASO 3</text>
  <text x="540" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#121212" letter-spacing="-0.02em">Ingresa tus datos</text>
  <text x="540" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#5F6368">Nombre, contacto y datos importantes.</text>
  
  <!-- Realistic Step 4 Screenshot Mockup (SOS Contact) -->
  <g transform="translate(360, 520)">
    <rect width="360" height="520" rx="24" fill="#F8FAFC" stroke="#EDF2F7" stroke-width="1.5"/>
    
    <g transform="translate(30, 30)">
      <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">Paso 4 de 4</text>
      <rect x="70" y="-8" width="230" height="4" rx="2" fill="#EDF2F7"/>
      <rect x="70" y="-8" width="230" height="4" rx="2" fill="#0052FF"/>
    </g>
    
    <text x="180" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#121212">Contacto SOS</text>
    
    <g transform="translate(30, 140)">
      <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">NOMBRE CONTACTO</text>
