<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#F8FAFC"/>
  <rect x="80" y="200" width="920" height="950" rx="40" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="80" y="200" width="920" height="950" rx="40" fill="none" stroke="#EDF2F7" stroke-width="1"/>
  
  <text x="540" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052FF" letter-spacing="0.2em">PASO 2</text>
  <text x="540" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#121212" letter-spacing="-0.02em">Crea tu perfil</text>
  <text x="540" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#5F6368">Toma menos de un minuto.</text>
  
  <!-- Realistic Step 1 Screenshot Mockup -->
  <g transform="translate(360, 520)">
    <rect width="360" height="520" rx="24" fill="#F8FAFC" stroke="#EDF2F7" stroke-width="1.5"/>
    
    <!-- App Header Simulation -->
    <g transform="translate(30, 30)">
      <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">Paso 1 de 4</text>
      <rect x="70" y="-8" width="230" height="4" rx="2" fill="#EDF2F7"/>
      <rect x="70" y="-8" width="57" height="4" rx="2" fill="#0052FF"/>
    </g>
    
    <text x="180" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#121212">Datos básicos</text>
    
    <!-- Form Content -->
    <g transform="translate(30, 140)">
      <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">NOMBRE COMPLETO</text>
      <rect y="10" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1"/>
      <text x="10" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#121212">Alejandro Olarte</text>
      
      <g transform="translate(0, 70)">
        <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">ESTATURA / EDAD</text>
        <rect y="10" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1"/>
        <text x="10" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#121212">21 años</text>
      </g>
      
      <g transform="translate(0, 140)">
        <text font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6368">TIPO DE SANGRE</tspan>
        <g transform="translate(0, 15)">
          <rect width="60" height="30" rx="4" fill="#0052FF"/>
          <text x="30" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">O+</text>
          
          <rect x="70" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#EDF2F7" stroke-width="1"/>
          <text x="95" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5F6368">A-</text>
        </g>
      </g>
      
      <!-- Primary Save Button -->
      <g transform="translate(0, 240)">
        <rect width="300" height="48" rx="24" fill="#0052FF"/>
        <text x="150" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">CONTINUAR →</text>
      </g>
    </g>
  </g>
  
  <!-- Footer Navigation -->
  <g transform="translate(540, 1100)">
    <g transform="translate(-87, 0)">
      <circle cx="0" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="25" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="50" cy="0" r="5" fill="#0052FF"/>
      <circle cx="75" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="100" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="125" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="150" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="175" cy="0" r="5" fill="#DBEAFE"/>
    </g>
  </g>
