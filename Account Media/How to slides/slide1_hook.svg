<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1350" fill="#F8FAFC"/>
  
  <!-- Main Premium Card -->
  <rect x="80" y="200" width="920" height="950" rx="40" fill="#FFFFFF" fill-opacity="1"/>
  <rect x="80" y="200" width="920" height="950" rx="40" fill="none" stroke="#EDF2F7" stroke-width="1"/>
  
  <!-- Brand Logo Context -->
  <g transform="translate(510, 280) scale(1.5)">
    <path d="M16 10 L26 36 L36 10" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M23 14 H29 M26 11 V17" fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
    <polyline points="18,25 22,25 24,19 27,31 30,23 34,25" fill="none" stroke="#9eeb47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography Stack -->
  <text x="540" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052FF" letter-spacing="0.2em">PREVENCIÓN INTELIGENTE</text>
  
  <text x="540" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#121212" letter-spacing="-0.02em">
    <tspan x="540" dy="0">Prepárate antes</tspan>
    <tspan x="540" dy="80">de necesitarlo</tspan>
  </text>
  
  <text x="540" y="820" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" letter-spacing="-0.01em">
    <tspan x="540" dy="0">Tu información médica disponible</tspan>
    <tspan x="540" dy="45">en segundos.</tspan>
  </text>
  
  <!-- CTA Footer Area -->
  <g transform="translate(540, 1050)">
    <text text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052FF" letter-spacing="0.1em">DESLIZA PARA EMPEZAR →</text>
    
    <!-- Step Indicator -->
    <g transform="translate(-60, 40)">
      <circle cx="0" cy="0" r="5" fill="#0052FF"/>
      <circle cx="25" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="50" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="75" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="100" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="125" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="150" cy="0" r="5" fill="#DBEAFE"/>
      <circle cx="175" cy="0" r="5" fill="#DBEAFE"/>
    </g>
  </g>
</svg>
