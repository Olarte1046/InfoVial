<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Paso 4</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="app-container">
        <div class="mb-24" style="display: flex; justify-content: space-between; align-items: center;">
            <span class="label" style="margin: 0;">Paso 4 de 4</span>
            <div
                style="height: 4px; flex: 1; background: var(--border); margin-left: 16px; border-radius: 2px; position: relative; overflow: hidden;">
                <div
                    style="position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: var(--primary);">
                </div>
            </div>
        </div>

        <h1>Contacto SOS</h1>
        <p class="description">Persona a la que debemos llamar en caso de emergencia.</p>

        <div class="card">
            <div class="input-group">
                <label class="label">Nombre contacto</label>
                <input type="text" id="contacto_nombre" placeholder="Ej. María García">
            </div>

            <div class="input-group">
                <label class="label">Teléfono</label>
                <input type="tel" id="contacto_tel" placeholder="+57 300 000 0000">
            </div>

            <div class="input-group">
                <label class="label">Relación</label>
                <input type="text" id="contacto_relacion" placeholder="Ej. Esposa, Padre...">
            </div>

            <div class="input-group">
                <label class="label">Ciudad</label>
                <input type="text" id="ciudad" placeholder="Ej. Bogotá">
            </div>
        </div>

        <div class="mt-auto">
            <button onclick="save()" class="btn btn-primary">Revisar perfil</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function save() {
            const contacto_nombre = document.getElementById('contacto_nombre').value;
            const contacto_tel = document.getElementById('contacto_tel').value;
            const contacto_relacion = document.getElementById('contacto_relacion').value;
            const ciudad = document.getElementById('ciudad').value;

            if (!contacto_nombre || !contacto_tel || !contacto_relacion) {
                alert('Por favor completa los campos de contacto');
                return;
            }

            InfoVial.saveData({
                contacto_nombre,
                contacto_tel,
                contacto_relacion,
                ciudad
            });
            InfoVial.nextStep('step4b.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.contacto_nombre) document.getElementById('contacto_nombre').value = data.contacto_nombre;
            if (data.contacto_tel) document.getElementById('contacto_tel').value = data.contacto_tel;
            if (data.contacto_relacion) document.getElementById('contacto_relacion').value = data.contacto_relacion;
            if (data.ciudad) document.getElementById('ciudad').value = data.ciudad;
        }
    </script>
</body>

</html>
