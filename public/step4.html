<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVial - Paso 4</title>
    <style>
        :root {
            --primary: #12324A;
            --primary-night: #0E2235;
            --text: #0F1720;
            --muted: #5F6368;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #D8E0E7;
            --shadow: 0 4px 12px rgba(18, 50, 74, 0.05);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100dvh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 24px;
            font-weight: 700;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 0 24px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 17px;
            outline: none;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.9);
            appearance: none;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(18, 50, 74, 0.1);
        }

        .footer {
            padding: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="header">PASO 4 DE 4</div>
        <div class="content">
            <h2>Contacto SOS</h2>
            <div class="field"><label>Nombre contacto</label><input type="text" id="contacto_nombre"
                    placeholder="Ej. María García"></div>
            <div class="field"><label>Teléfono</label><input type="tel" id="contacto_tel"
                    placeholder="+57 300 000 0000"></div>
            <div class="field"><label>Relación</label><input type="text" id="contacto_relacion"
                    placeholder="Ej. Esposa, Padre..."></div>
            <div class="field"><label>Ciudad</label><input type="text" id="ciudad" placeholder="Ej. Bogotá"></div>
        </div>
        <div class="footer"><button onclick="save()" class="btn">Revisar perfil</button></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        function save() {
            const contacto_nombre = document.getElementById('contacto_nombre').value;
            const contacto_tel = document.getElementById('contacto_tel').value;
            const contacto_relacion = document.getElementById('contacto_relacion').value;
            const ciudad = document.getElementById('ciudad').value;

            if (!contacto_nombre || !contacto_tel || !contacto_relacion) {
                alert('Por favor completa los campos de contacto');
                return;
            }

            InfoVial.saveData({
                contacto_nombre,
                contacto_tel,
                contacto_relacion,
                ciudad
            });
            InfoVial.nextStep('step4b.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.contacto_nombre) document.getElementById('contacto_nombre').value = data.contacto_nombre;
            if (data.contacto_tel) document.getElementById('contacto_tel').value = data.contacto_tel;
            if (data.contacto_relacion) document.getElementById('contacto_relacion').value = data.contacto_relacion;
            if (data.ciudad) document.getElementById('ciudad').value = data.ciudad;
        }
    </script>
</body>

</html>
