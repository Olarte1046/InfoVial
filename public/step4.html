<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Finalizar</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="app-container">
        <div style="display: flex; align-items: center; margin-bottom: 40px; margin-top: 20px;">
            <div
                style="height: 4px; flex: 1; background: var(--border); border-radius: 2px; position: relative; overflow: hidden;">
                <div
                    style="position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: var(--primary);">
                </div>
            </div>
            <span
                style="font-size: 12px; font-weight: 800; color: var(--primary); margin-left: 16px; letter-spacing: 1px;">FINALIZAR</span>
        </div>

        <div class="animate-fade">
            <h1>Casi listo.</h1>
            <p class="description" style="margin-bottom: 32px;">Detalles finales para una cobertura médica completa.</p>

            <div class="card">
                <div style="margin-bottom: 20px;">
                    <label class="label">Ciudad de residencia</label>
                    <input type="text" id="ciudad" placeholder="Ej. Medellín, Colombia">
                </div>

                <div>
                    <label class="label">EPS / Seguro de Salud</label>
                    <input type="text" id="eps" placeholder="Ej. Sura, Sanitas, Colsánitas">
                </div>
            </div>

            <div
                style="background: var(--primary-soft); padding: 20px; border-radius: 16px; display: flex; gap: 16px; align-items: center; margin-top: 24px;">
                <div style="font-size: 24px;">🛡️</div>
                <div style="font-size: 13px; color: var(--primary); font-weight: 600; line-height: 1.4;">InfoVial
                    protege tus datos con encriptación de grado médico y acceso controlado.</div>
            </div>
        </div>

        <div class="mt-auto animate-fade" style="padding-bottom: 24px; padding-top: 24px;">
            <button onclick="save()" class="btn btn-primary">Crear mi perfil</button>
            <button onclick="InfoVial.backStep()" class="btn btn-back" style="margin-top: 12px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Volver atrás
            </button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function save() {
            const ciudad = document.getElementById('ciudad').value;
            const eps = document.getElementById('eps').value;
            InfoVial.saveData({ ciudad, eps });
            InfoVial.nextStep('step4b.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.ciudad) document.getElementById('ciudad').value = data.ciudad;
            if (data.eps) document.getElementById('eps').value = data.eps;
        }
    </script>
</body>

</html>
