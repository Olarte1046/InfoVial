<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Recuperar Acceso</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="app-container">
        <div class="logo-box animate-fade" style="margin-top: 40px;">
            <img src="/assets/logo-primary-horizontal.svg" alt="InfoVial" class="logo-main">
        </div>

        <div class="animate-fade" style="animation-delay: 0.1s;">
            <div class="card" style="padding: 32px;">
                <h2>Recuperar Cuenta</h2>
                <p class="description" style="margin-bottom: 24px; font-size: 14px;">Ingresa tu email para recibir un
                    enlace de recuperación.</p>

                <div style="margin-bottom: 24px;">
                    <label class="label">Tu Email</label>
                    <input type="email" id="reset-email" placeholder="tu@email.com" required>
                </div>

                <button id="reset-btn" onclick="handleReset()" class="btn btn-primary">Enviar Enlace</button>
                <div id="reset-msg" style="margin-top: 20px; text-align: center; font-size: 14px; display: none;"></div>
            </div>

            <p style="text-align: center; margin-top: 32px;"><a href="login.html"
                    style="color: var(--text-muted); font-size: 14px; text-decoration: none;">← Volver al ingreso</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script>
        async function handleReset() {
            const email = document.getElementById('reset-email').value;
            const btn = document.getElementById('reset-btn');
            const msg = document.getElementById('reset-msg');

            if (!email) return;
            btn.disabled = true;
            btn.innerText = 'Enviando...';

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/login.html',
                });
                if (error) throw error;
                msg.textContent = '¡Enviado! Revisa tu bandeja de entrada.';
                msg.style.color = 'var(--success)';
                msg.style.display = 'block';
            } catch (err) {
                msg.textContent = err.message;
                msg.style.color = 'var(--critical)';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Enviar Enlace';
            }
        }
    </script>
</body>

</html>
