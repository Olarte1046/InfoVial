<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Activar Perfil</title>
    <link rel="stylesheet" href="/css/main.css">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('infovial_theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        })();
    </script>
</head>

<body>
    <div class="app-container">
        <div class="logo-box animate-fade" style="margin-top: 40px;">
            <svg width="170" height="48" viewBox="0 0 170 48" xmlns="http://www.w3.org/2000/svg"
                style="display:block;margin:0 auto;">
                <g>
                    <path d="M4 10 L14 36 L24 10" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <polyline points="6,24 10,24 12,18 15,30 18,22 22,24" fill="none" stroke="#2EC4B6" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <text x="36" y="31" font-family="Manrope, sans-serif" font-size="22" font-weight="800"
                    fill="currentColor">Infovial</text>
            </svg>
        </div>

        <div class="animate-fade" id="reg-main" style="animation-delay: 0.1s;">
            <h1>Casi eres parte de InfoVial.</h1>
            <p class="description" style="margin-bottom: 32px;">Para proteger tu información, validaremos tu identidad
                vía email.</p>

            <div class="card" style="padding: 32px;">
                <div style="margin-bottom: 24px;">
                    <label class="label">Tu Email Principal</label>
                    <input type="email" id="email" placeholder="tu@email.com" style="font-size: 16px;">
                </div>

                <div id="auth-error"
                    style="color: var(--critical); font-size: 14px; margin-bottom: 16px; text-align: center; display: none; font-weight: 600;">
                </div>

                <button id="finalize-btn" onclick="startActivation()" class="btn btn-primary">Recibir Enlace de
                    Activación</button>
            </div>

            <p style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                Al continuar, aceptas nuestros <a href="/legal/terms.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 700;">Términos</a>.
            </p>
        </div>

        <div id="reg-sent" style="display: none; text-align: center; padding: 40px 24px; animation: fadeIn 0.4s ease;">
            <div style="font-size: 48px; margin-bottom: 24px;">🛡️</div>
            <h2 style="font-family: 'Manrope', sans-serif;">Verificación en curso</h2>
            <p class="description">Hemos enviado un enlace especial a <strong
                    id="sent-email-display"></strong>.<br><br>Al hacer clic en el enlace, tu perfil se activará
                automáticamente y verás tu código QR.</p>
            <button onclick="location.reload()" class="btn btn-outline"
                style="margin-top: 32px; font-size: 13px; font-weight: 800;">Volver a intentar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function startActivation() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('finalize-btn');
            const errDiv = document.getElementById('auth-error');

            if (!email) { alert('Ingresa tu email para continuar'); return; }

            btn.disabled = true;
            btn.innerText = 'Preparando activación...';
            errDiv.style.display = 'none';

            try {
                const regData = InfoVial.getData();
                regData.email = email;
                regData.pending_profile = true;
                InfoVial.saveData(regData);

                // Pass registration data via user_metadata so it survives
                // cross-device magic link opens (localStorage won't be there)
                const { error } = await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: 'https://infovial.app/dashboard.html?action=complete_registration',
                        data: {
                            nombre: regData.nombre || '',
                            edad: regData.edad || null,
                            sangre: regData.sangre || '',
                            condiciones: regData.condiciones || '',
                            medicamentos: regData.medicamentos || '',
                            contacto_nombre: regData.contacto_nombre || '',
                            contacto_relacion: regData.contacto_relacion || '',
                            telefono_emergencia: regData.telefono_emergencia || '',
                            ciudad: regData.ciudad || '',
                            eps: regData.eps || '',
                            pending_profile: true
                        }
                    }
                });

                if (error) throw error;

                document.getElementById('reg-main').style.display = 'none';
                document.getElementById('sent-email-display').textContent = email;
                document.getElementById('reg-sent').style.display = 'block';

            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Recibir Enlace de Activación';
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>

</html>
