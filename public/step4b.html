<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Crear Cuenta</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="app-container">
        <div class="logo-box animate-fade" style="margin-top: 40px;">
            <img src="/assets/logo-stacked-mobile.svg" alt="InfoVial" style="height: 60px;">
        </div>

        <div class="animate-fade" style="animation-delay: 0.1s;">
            <h1>Crea tu cuenta segura.</h1>
            <p class="description" style="margin-bottom: 32px;">Para proteger tu información, necesitamos que crees una
                contraseña.</p>

            <div class="card">
                <div style="margin-bottom: 20px;">
                    <label class="label">Email de contacto</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>

                <div style="margin-bottom: 24px;">
                    <label class="label">Contraseña (Mín. 6 caracteres)</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <div id="auth-error"
                    style="color: var(--critical); font-size: 14px; margin-bottom: 16px; text-align: center; display: none;">
                </div>

                <button id="finalize-btn" onclick="finalizeRegistration()" class="btn btn-primary">Finalizar y Activar
                    QR</button>
            </div>
        </div>

        <div class="mt-auto animate-fade" style="padding-bottom: 24px; animation-delay: 0.2s;">
            <p style="text-align: center; font-size: 13px; color: var(--text-muted);">Al registrarte, aceptas nuestros
                <a href="/legal/terms.html"
                    style="color: var(--primary); text-decoration: none; font-weight: 700;">Términos y Condiciones</a>.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function finalizeRegistration() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('finalize-btn');
            const errDiv = document.getElementById('auth-error');

            if (!email || !password) { alert('Completa los datos de acceso'); return; }

            btn.disabled = true;
            btn.innerText = 'Activando perfil...';
            errDiv.style.display = 'none';

            try {
                // 1. Sign up user
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
                if (authError) throw authError;

                // 2. Prepare profile data
                const regData = InfoVial.getData();
                const public_slug = crypto.randomUUID();
                const vital_id = 'IV-' + Math.random().toString(36).substring(2, 7).toUpperCase();

                // 3. Create profile in DB
                const { error: dbError } = await supabaseClient.from('profiles').insert({
                    user_id: authData.user.id,
                    nombre: regData.nombre,
                    edad: regData.edad,
                    sangre: regData.sangre,
                    condiciones: regData.condiciones,
                    medicamentos: regData.medicamentos,
                    contacto_nombre: regData.contacto_nombre,
                    contacto_relacion: regData.contacto_relacion,
                    telefono_emergencia: regData.telefono_emergencia,
                    ciudad: regData.ciudad,
                    eps: regData.eps,
                    public_slug: public_slug,
                    vital_id: vital_id
                });

                if (dbError) throw dbError;

                // Success
                InfoVial.clearData();
                window.location.href = 'step5.html?s=' + public_slug;

            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Finalizar y Activar QR';
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>

</html>
