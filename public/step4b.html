<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVital - Revisión</title>
    <style>
        :root {
            --primary: #0052FF;
            --text: #1A1C1E;
            --muted: #667085;
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #E4E7EC;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 24px;
            font-weight: 700;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 0 24px;
            overflow-y: auto;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.desc {
            color: var(--muted);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .review-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .edit-link {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }

        .review-group {
            margin-bottom: 16px;
        }

        .review-group:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-top: 2px;
        }

        .footer {
            padding: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:disabled {
            background: var(--muted);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            color: var(--muted);
            font-size: 15px;
            background: none;
        }

        .legal-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .legal-check input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
        }

        .legal-check label {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.4;
        }

        .legal-check label a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="header">REVISIÓN FINAL</div>
        <div class="content">
            <h2>Confirma tus datos</h2>
            <p class="desc">Verifica que la información sea correcta antes de generar tu código QR permanente.</p>

            <div class="review-card">
                <a href="step1.html" class="edit-link">Editar</a>
                <div class="review-group">
                    <div class="label">Paciente</div>
                    <div id="summary-paciente" class="value">...</div>
                </div>
                <div class="review-group">
                    <div class="label">Tipo de Sangre</div>
                    <div id="summary-sangre" class="value" style="color: var(--primary); font-size: 24px;">...</div>
                </div>
            </div>

            <div class="review-card">
                <a href="step2.html" class="edit-link" style="top: 15px">Editar</a>
                <div class="review-group">
                    <div class="label">Condiciones / Alergias</div>
                    <div id="summary-condiciones" class="value">...</div>
                </div>
                <div class="review-group">
                    <a href="step3.html" class="edit-link" style="top: 60px">Editar</a>
                    <div class="label">Medicamentos</div>
                    <div id="summary-medicamentos" class="value">...</div>
                </div>
            </div>

            <div class="review-card" style="border-left: 4px solid var(--primary);">
                <a href="step4.html" class="edit-link">Editar</a>
                <div class="review-group">
                    <div class="label">Contacto SOS</div>
                    <div id="summary-contacto-nom" class="value">...</div>
                    <div id="summary-contacto-tel" class="value" style="font-size: 15px; font-weight: 400;">...</div>
                </div>
            </div>

            <div class="legal-check">
                <input type="checkbox" id="legal-consent" onchange="toggleConfirm()">
                <label for="legal-consent">
                    Declaro que he leído y acepto la <a href="/privacy">Política de Privacidad</a>,
                    los <a href="/terms">Términos</a> y el <a href="/disclaimer">Aviso Legal</a>.
                </label>
            </div>
        </div>
        <div class="footer">
            <button id="confirm-btn" onclick="confirmCreation()" class="btn btn-primary" disabled>Confirmar y crear
                QR</button>
            <a href="step1.html" class="btn btn-secondary">Editar información</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        const data = InfoVital.getData();
        window.onload = () => {
            document.getElementById('summary-paciente').textContent = `${data.nombre} (${data.edad} años)`;
            document.getElementById('summary-sangre').textContent = data.sangre;
            document.getElementById('summary-condiciones').textContent =
                Array.isArray(data.condiciones)
                    ? data.condiciones.join(', ')
                    : (data.condiciones || 'Ninguna');
            document.getElementById('summary-medicamentos').textContent = data.medicamentos || 'Ninguno';
            document.getElementById('summary-contacto-nom').textContent = `${data.contacto_nombre} (${data.contacto_relacion})`;
            document.getElementById('summary-contacto-tel').textContent = data.contacto_tel;
        }

        function toggleConfirm() {
            document.getElementById('confirm-btn').disabled = !document.getElementById('legal-consent').checked;
        }

        async function confirmCreation() {
            const btn = document.getElementById('confirm-btn');
            const data = InfoVital.getData(); // Get fresh data
            btn.disabled = true;
            btn.textContent = 'Creando perfil...';

            // Generate unique ID in hex (8 characters)
            const hexId = Math.random().toString(16).slice(2, 10);
            const fullId = `VITAL-${hexId.toUpperCase()}`;

            const profileData = {
                vital_id: fullId,
                nombre: data.nombre || null,
                edad: parseInt(data.edad) || null,
                sangre: data.sangre || null,
                condiciones: Array.isArray(data.condiciones)
                    ? data.condiciones.join(', ')
                    : data.condiciones || null,
                medicamentos: data.medicamentos || null,
                eps: data.eps || "No especificado",
                telefono_emergencia: data.contacto_tel || null,
                contacto_nombre: data.contacto_nombre || null,
                contacto_relacion: data.contacto_relacion || null,
                ciudad: data.ciudad || "No especificada"
            };

            try {
                const { data: inserted, error } = await supabaseClient
                    .from('profiles')
                    .insert([profileData])
                    .select()
                    .single();

                if (error) throw error;

                // Save vital_id for the QR generation in step5
                localStorage.setItem('infovital_last_id', fullId);
                InfoVital.nextStep('step5.html');

            } catch (err) {
                console.error('Error Supabase:', err);
                alert('Error al guardar en la nube: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Confirmar y crear QR';
            }
        }
    </script>
</body>

</html>
