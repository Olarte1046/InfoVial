<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Revisión</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .review-card {
            position: relative;
            padding-top: 32px;
        }

        .edit-link {
            position: absolute;
            top: 14px;
            right: 16px;
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .blood-value {
            color: var(--primary);
            font-size: 28px;
            font-weight: 900;
            margin-top: 4px;
        }

        .legal-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            background: rgba(0, 82, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .legal-check label {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .legal-check a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-overlay.active {
            display: flex;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme"></button>
        <div class="mb-24">
            <h1>Confirma tus datos</h1>
            <p class="description">Verifica que la información sea correcta.</p>
        </div>

        <div class="card review-card"><a href="step1.html" class="edit-link">Editar</a>
            <div class="input-group"><label class="label">Identidad</label>
                <div id="summary-paciente" class="value" style="font-weight: 700; font-size: 17px;">...</div>
            </div>
            <div class="input-group"><label class="label">Tipo de Sangre</label>
                <div id="summary-sangre" class="blood-value">...</div>
            </div>
        </div>
        <div class="card review-card"><a href="step2.html" class="edit-link">Editar</a>
            <div class="input-group"><label class="label">Condiciones / Alergias</label>
                <div id="summary-condiciones" class="value" style="font-weight: 600;">...</div>
            </div>
        </div>
        <div class="card review-card" style="border-left: 4px solid var(--critical);"><a href="step4.html"
                class="edit-link">Editar</a>
            <div class="input-group"><label class="label">Contacto de Emergencia</label>
                <div id="summary-contacto-nom" class="value" style="font-weight: 700;">...</div>
                <div id="summary-contacto-tel" class="value"
                    style="color: var(--text-muted); font-size: 15px; margin-top: 4px;">...</div>
            </div>
        </div>

        <div class="legal-check"><input type="checkbox" id="legal-consent" onchange="toggleConfirm()"><label
                for="legal-consent">Acepto la <a href="/legal/privacy.html">Política de Privacidad</a>.</label></div>

        <div class="mt-auto">
            <button onclick="InfoVial.backStep()" class="btn btn-back">← Volver</button>
            <button id="confirm-btn" onclick="startConfirmation()" class="btn btn-primary" disabled>Confirmar y
                guardar</button>
        </div>
    </div>

    <!-- Secure Profile Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="card" style="max-width: 400px; width: 100%;">
            <h2 style="margin-bottom: 8px;">Asegura tu Perfil</h2>
            <p class="description" style="margin-bottom: 24px;">Crea una cuenta para poder gestionar tu perfil médico en
                el futuro.</p>
            <form onsubmit="handleFinalAuth(event)">
                <div class="input-group"><label class="label">Tu Email</label><input type="email" id="auth-email"
                        required></div>
                <div class="input-group"><label class="label">Elige una contraseña</label><input type="password"
                        id="auth-pass" required minlength="6"></div>
                <button type="submit" id="final-btn" class="btn btn-primary">Registrar y Generar QR</button>
                <p style="text-align: center; margin-top: 16px; font-size: 13px;">¿Ya tienes cuenta? <a
                        href="login.html" style="color: var(--primary); font-weight: 700;">Ingresa aquí</a></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function renderSummary() {
            const data = InfoVial.getData();
            if (!data.nombre) window.location.href = 'step1.html';
            document.getElementById('summary-paciente').textContent = `${data.nombre} (${data.edad} años)`;
            document.getElementById('summary-sangre').textContent = data.sangre;
            document.getElementById('summary-condiciones').textContent = Array.isArray(data.condiciones) ? data.condiciones.join(', ') : (data.condiciones || 'Ninguna');
            document.getElementById('summary-contacto-nom').textContent = `${data.contacto_nombre}`;
            document.getElementById('summary-contacto-tel').textContent = data.contacto_tel;
        }
        renderSummary();
        function toggleConfirm() { document.getElementById('confirm-btn').disabled = !document.getElementById('legal-consent').checked; }

        async function startConfirmation() {
            const session = await InfoVial.getSession();
            if (session) {
                await finalizeProfile(session.user.id);
            } else {
                document.getElementById('auth-overlay').classList.add('active');
            }
        }

        async function handleFinalAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const btn = document.getElementById('final-btn');
            btn.disabled = true;
            btn.textContent = 'Creando cuenta...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) throw error;
                if (!data.session) {
                    alert('Por favor confirma tu email para activar tu perfil.');
                    window.location.href = 'index.html';
                } else {
                    await finalizeProfile(data.user.id);
                }
            } catch (err) {
                alert('Error: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Registrar y Generar QR';
            }
        }

        async function finalizeProfile(userId) {
            const data = InfoVial.getData();
            const hexId = Math.random().toString(16).slice(2, 10).toUpperCase();
            const fullId = `VIAL-${hexId}`;
            const publicSlug = self.crypto.randomUUID(); // Secure unique identifier

            const profileData = {
                user_id: userId,
                vital_id: fullId,
                public_slug: publicSlug,
                nombre: data.nombre,
                edad: parseInt(data.edad),
                sangre: data.sangre,
                condiciones: Array.isArray(data.condiciones) ? data.condiciones.join(', ') : data.condiciones,
                medicamentos: data.medicamentos,
                telefono_emergencia: data.contacto_tel,
                contacto_nombre: data.contacto_nombre,
                contacto_relacion: data.contacto_relacion,
                ciudad: data.ciudad || "Medellin",
                eps: data.eps || "No especificada"
            };

            try {
                const { error } = await supabaseClient.from('profiles').insert([profileData]);
                if (error) throw error;
                localStorage.setItem('infovial_last_id', fullId);
                localStorage.setItem('infovial_last_slug', publicSlug);
                InfoVial.nextStep('step5.html');
            } catch (err) {
                alert('Error al guardar perfil: ' + err.message);
            }
        }
    </script>
</body>

</html>
