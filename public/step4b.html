<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme"></button>

        <div class="mb-24">
            <span class="label">Revisión Final</span>
            <h1>Confirma tus datos</h1>
            <p class="description">Verifica que la información sea correcta antes de generar tu código QR permanente.
            </p>
        </div>

        <div class="logo-centered" style="margin-bottom: 24px;">
            <svg width="120" height="32" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <path d="M16 10 L26 36 L36 10" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <polyline points="18,24 22,24 24,18 27,30 30,22 34,24" fill="none" stroke="#2EC4B6" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <text x="52" y="30" font-family="Manrope, sans-serif" font-size="20" font-weight="600"
                    fill="currentColor">Infovial</text>
            </svg>
        </div>

        <div class="card review-card">
            <a href="step1.html" class="edit-link">Editar</a>
            <div class="input-group">
                <label class="label">Identidad</label>
                <div id="summary-paciente" class="value" style="font-weight: 700; font-size: 17px;">...</div>
            </div>
            <div class="input-group">
                <label class="label">Tipo de Sangre</label>
                <div id="summary-sangre" class="blood-value">...</div>
            </div>
        </div>

        <div class="card review-card">
            <a href="step2.html" class="edit-link">Editar</a>
            <div class="input-group">
                <label class="label">Condiciones / Alergias</label>
                <div id="summary-condiciones" class="value" style="font-weight: 600;">...</div>
            </div>
            <div class="input-group mt-16">
                <label class="label">Medicamentos</label>
                <div id="summary-medicamentos" class="value" style="font-weight: 600;">...</div>
            </div>
        </div>

        <div class="card review-card" style="border-left: 4px solid var(--critical);">
            <a href="step4.html" class="edit-link">Editar</a>
            <div class="input-group">
                <label class="label">Contacto de Emergencia</label>
                <div id="summary-contacto-nom" class="value" style="font-weight: 700;">...</div>
                <div id="summary-contacto-tel" class="value"
                    style="color: var(--text-muted); font-size: 15px; margin-top: 4px;">...</div>
            </div>
        </div>

        <div class="legal-check">
            <input type="checkbox" id="legal-consent" onchange="toggleConfirm()">
            <label for="legal-consent">
                Acepto la <a href="/legal/privacy.html">Política de Privacidad</a>, el <a
                    href="/legal/data-policy.html">Tratamiento de Datos Personal</a> y el <a
                    href="/legal/disclaimer.html">Aviso Legal</a>.
            </label>
        </div>

        <div class="mt-auto">
            <button onclick="InfoVial.backStep()" class="btn btn-back">← Volver</button>
            <button id="confirm-btn" onclick="confirmCreation()" class="btn btn-primary" disabled>Confirmar y crear
                QR</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="/js/app.js"></script>
    <script>
        const data = InfoVial.getData();
        if (!data || !data.nombre) window.location.href = 'step1.html';

        function renderSummary() {
            const data = InfoVial.getData();
            if (!data || !data.nombre) return;

            document.getElementById('summary-paciente').textContent = `${data.nombre} (${data.edad} años)`;
            document.getElementById('summary-sangre').textContent = data.sangre;
            document.getElementById('summary-condiciones').textContent = Array.isArray(data.condiciones) ? data.condiciones.join(', ') : (data.condiciones || 'Ninguna');
            document.getElementById('summary-medicamentos').textContent = data.medicamentos || 'Ninguno';
            document.getElementById('summary-contacto-nom').textContent = `${data.contacto_nombre} (${data.contacto_relacion})`;
            document.getElementById('summary-contacto-tel').textContent = data.contacto_tel;
        }

        renderSummary();
        window.addEventListener('load', renderSummary);

        function toggleConfirm() {
            document.getElementById('confirm-btn').disabled = !document.getElementById('legal-consent').checked;
        }

        async function confirmCreation() {
            const btn = document.getElementById('confirm-btn');
            const data = InfoVial.getData();
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            const hexId = Math.random().toString(16).slice(2, 10);
            const fullId = `VIAL-${hexId.toUpperCase()}`;

            const profileData = {
                vital_id: fullId,
                nombre: data.nombre,
                edad: parseInt(data.edad),
                sangre: data.sangre,
                condiciones: Array.isArray(data.condiciones) ? data.condiciones.join(', ') : data.condiciones,
                medicamentos: data.medicamentos,
                telefono_emergencia: data.contacto_tel,
                contacto_nombre: data.contacto_nombre,
                contacto_relacion: data.contacto_relacion,
                ciudad: data.ciudad || "No especificada",
                eps: data.eps || "No especificada"
            };

            try {
                const { error } = await supabaseClient.from('profiles').insert([profileData]);
                if (error) throw error;
                localStorage.setItem('infovial_last_id', fullId);
                InfoVial.nextStep('step5.html');
            } catch (err) {
                console.error('Error:', err);
                alert('Error al guardar: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Confirmar y crear QR';
            }
        }
    </script>
</body>

</html>
