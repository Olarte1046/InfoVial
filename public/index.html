<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Bienvenida</title>
    <link rel="stylesheet" href="/css/main.css">

    <!-- Theme Stabilization Fix -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('infovial_theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        })();
    </script>
</head>

<body>
    <div class="app-container"
        style="display: flex; flex-direction: column; justify-content: center; min-height: 100dvh;">

        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Cambiar tema visual">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div class="animate-fade" style="text-align: center; margin-bottom: 24px;">
            <img src="/assets/logo-icon-only.svg" alt="InfoVial Logo"
                style="width: 80px; height: 80px; margin-bottom: 24px; filter: drop-shadow(0 10px 20px rgba(0,82,255,0.2));"
                onerror="this.src='/logo-icon-only.svg'">
            <h1>InfoVial</h1>
            <p class="description" style="margin-top: 16px; margin-bottom: 0;">
                Crea tu perfil médico de emergencia en minutos y genera tu <strong>Vial-ID QR</strong>.
            </p>
        </div>

        <div class="card animate-fade"
            style="animation-delay: 0.1s; padding: 24px; text-align: center; margin-bottom: 0;">
            <a href="step1.html" class="btn btn-primary" style="margin-bottom: 16px;">
                Crear nuevo perfil
            </a>
            <a href="login.html" class="btn btn-outline" style="background: transparent;">
                Ingresar a mi cuenta
            </a>
        </div>

        <div style="text-align: center; margin-top: 32px;" class="animate-fade" style="animation-delay: 0.2s;">
            <p style="font-size: 13px; color: var(--text-muted);">Seguridad de grado médico.</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="/js/app.js" defer></script>
</body>

</html>
