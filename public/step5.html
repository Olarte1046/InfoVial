<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Código QR</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .success-hero {
            text-align: center;
            padding: 40px 0 24px;
        }

        .icon-check {
            width: 56px;
            height: 56px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            box-shadow: 0 4px 12px rgba(46, 196, 182, 0.3);
        }

        .qr-card-container {
            text-align: center;
            padding: 32px;
            background: white;
            border-radius: 32px;
            box-shadow: var(--shadow-strong);
            margin-bottom: 32px;
            border: 1px solid var(--border);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .qr-code {
            width: 240px;
            height: 240px;
            margin: 0 auto;
        }

        .qr-code img {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .id-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #F0F4F8;
            border-radius: 20px;
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="success-hero">
            <div class="icon-check">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h1>¡Perfil listo!</h1>
            <p class="description">Tu perfil médico ha sido guardado exitosamente.</p>
        </div>

        <div class="qr-card-container">
            <div class="qr-code">
                <img id="qr-display" src="" alt="Código QR Vital">
            </div>
            <div id="vital-id-display" class="id-badge">Cargando ID...</div>
            <p style="margin-top: 16px; font-size: 13px; color: var(--text-muted);">Escanea para verificar o descarga la
                imagen.</p>
        </div>

        <div class="mt-auto">
            <a id="qr-download" href="#" download="InfoVial-QR.png" class="btn btn-primary mb-16">Descargar Código
                QR</a>
            <a href="index.html" class="btn btn-outline">Finalizar</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        window.onload = () => {
            const lastId = localStorage.getItem('infovial_last_id');
            if (lastId) {
                document.getElementById('vital-id-display').textContent = lastId;
                const domain = window.location.origin;
                const profileUrl = `${domain}/u.html?id=${lastId}`;

                const temp = document.createElement('div');
                new QRCode(temp, {
                    text: profileUrl,
                    width: 480,
                    height: 480,
                    colorDark: "#121212",
                    colorLight: "#FFFFFF",
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    const canvas = temp.querySelector('canvas');
                    const qrDataUrl = canvas ? canvas.toDataURL("image/png") : temp.querySelector('img').src;
                    document.getElementById('qr-display').src = qrDataUrl;
                    document.getElementById('qr-download').href = qrDataUrl;
                }, 200);
            }
        };
    </script>
</body>

</html>
