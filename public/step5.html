<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVial - Código QR</title>
    <style>
        :root {
            --primary: #0052FF;
            --text: #1A1C1E;
            --muted: #667085;
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #E4E7EC;
            --red: #D32F2F;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100dvh;
            background: radial-gradient(at 0% 0%, #FFFFFF 0%, #F4F7F9 50%, #E8F0FE 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .iphone::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(0, 82, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .content {
            flex: 1;
            padding: 40px 24px;
            text-align: center;
        }

        .icon-success {
            width: 64px;
            height: 64px;
            background: #34C759;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
        }

        h2 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        p {
            color: var(--muted);
            margin: 12px 0 32px;
        }

        .qr-card {
            background: white;
            padding: 32px;
            border-radius: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            display: inline-block;
            border: 1px solid rgba(0, 0, 0, 0.05);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .qr-img {
            width: 220px;
            height: 220px;
            border-radius: 12px;
        }

        .footer {
            padding: 24px;
            gap: 12px;
            display: flex;
            flex-direction: column;
        }

        .btn {
            display: block;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="content">
            <div class="icon-success"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3">
                    <path d="M20 6L9 17l-5-5" />
                </svg></div>
            <h1>¡Perfil creado!</h1>
            <p>Escanea tu código para verificar la información o descarga la imagen para portarla siempre contigo.</p>
            <div class="qr-card">
                <img id="qr-display" src="" alt="QR Emergency" class="qr-img">
            </div>
        </div>
        <div class="footer">
            <a id="qr-download" href="#" download="InfoVial-QR.png" class="btn btn-primary">Descargar QR</a>
            <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script defer>
        window.onload = () => {
            const lastId = localStorage.getItem('infovial_last_id');
            if (lastId) {
                const domain = window.location.origin;
                const profileUrl = `${domain}/u/${lastId}`;

                // Create a temporary hidden container for QR generation
                const temp = document.createElement('div');
                new QRCode(temp, {
                    text: profileUrl,
                    width: 400,
                    height: 400,
                    colorDark: "#0052FF",
                    colorLight: "#FFFFFF",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Extract the image once rendered
                setTimeout(() => {
                    const canvas = temp.querySelector('canvas');
                    const qrDataUrl = canvas ? canvas.toDataURL("image/png") : temp.querySelector('img').src;
                    document.getElementById('qr-display').src = qrDataUrl;
                    document.getElementById('qr-download').href = qrDataUrl;
                }, 200);
            }
        };
    </script>
</body>

</html>
