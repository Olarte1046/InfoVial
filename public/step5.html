<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Perfil Activado</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .qr-display {
            width: 240px;
            height: 240px;
            background: white;
            padding: 20px;
            border-radius: 28px;
            margin: 0 auto 32px;
            box-shadow: var(--shadow-premium);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="animate-fade" style="text-align: center; margin-top: 40px;">
            <div style="font-size: 48px; margin-bottom: 24px;">✨</div>
            <h1>¡Perfil Activado!</h1>
            <p class="description" style="margin-bottom: 40px;">Tu identidad médica ya está segura y accesible mediante
                este código QR.</p>

            <div class="qr-display" id="qr-container">
                <!-- QR will be rendered here -->
            </div>

            <div class="card" style="margin-bottom: 40px; border-left: 5px solid var(--success);">
                <div
                    style="font-weight: 800; color: var(--success); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">
                    Próximo Paso</div>
                <div style="font-size: 15px; color: var(--text-main); line-height: 1.5; font-weight: 500;">Descarga tu
                    QR y pégalo en tu vehículo o llévalo contigo.</div>
            </div>
        </div>

        <div class="mt-auto animate-fade" style="padding-bottom: 40px; animation-delay: 0.1s;">
            <a href="dashboard.html" class="btn btn-primary">Ir a mi Panel de Control</a>
            <p style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-muted);">Recibirás un
                email de confirmación en unos minutos.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('s');
            if (slug) {
                const qrUrl = window.location.origin + '/u.html?s=' + slug;
                new QRCode(document.getElementById('qr-container'), {
                    text: qrUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#121212",
                    colorLight: "#FFFFFF",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        };
    </script>
</body>

</html>
