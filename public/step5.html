<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Perfil Activado</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .qr-display {
            width: 240px;
            height: 240px;
            background: white;
            padding: 20px;
            border-radius: 28px;
            margin: 0 auto 32px;
            box-shadow: var(--shadow-premium);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="animate-fade" style="text-align: center; margin-top: 40px;">
            <div style="margin-bottom: 28px;">
                <svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg"
                    style="margin: 0 auto; display: block; filter: drop-shadow(0 10px 20px rgba(0,82,255,0.12));">
                    <g transform="translate(15,0)">
                        <path d="M4 10 L14 36 L24 10" fill="none" stroke="#0052FF" stroke-width="3.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <polyline points="6,24 10,24 12,18 15,30 18,22 22,24" fill="none" stroke="#2EC4B6"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </g>
                    <text x="50" y="32" font-family="Manrope, sans-serif" font-size="26" font-weight="800"
                        fill="currentColor">Infovial</text>
                </svg>
            </div>
            <div style="font-size: 48px; margin-bottom: 24px;">✨</div>
            <h1>¡Perfil Activado!</h1>
            <p class="description" style="margin-bottom: 40px;">Tu identidad médica ya está segura y accesible mediante
                este código QR.</p>

            <div id="qr-container"
                style="width:260px; height:260px; background:white; padding:15px; border-radius:28px; margin:0 auto 32px; box-shadow: var(--shadow-premium); display:flex; align-items:center; justify-content:center;">
                <!-- QR will be rendered here -->
            </div>
            <p style="margin-top:-20px; margin-bottom: 30px; font-size:12px; color:var(--text-muted); font-weight:600;">
                ESCANEABLE EN CUALQUIER SMARTPHONE</p>

            <div class="card" style="margin-bottom: 40px; border-left: 5px solid var(--success);">
                <div
                    style="font-weight: 800; color: var(--success); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">
                    Próximo Paso</div>
                <div style="font-size: 15px; color: var(--text-main); line-height: 1.5; font-weight: 500;">Descarga tu
                    QR desde tu panel y llévalo contigo siempre.</div>
            </div>
        </div>

        <div class="mt-auto animate-fade" style="padding-bottom: 40px; animation-delay: 0.1s;">
            <a href="dashboard.html" class="btn btn-primary">Ir a mi Panel de Control</a>
            <p style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-muted);">Puedes editar
                tus datos cuando lo necesites.</p>
        </div>
    </div>

    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script>
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('s');
            if (slug) {
                const container = document.getElementById('qr-container');
                const qrUrl = window.location.origin + '/u.html?s=' + slug;

                const qrCode = new QRCodeStyling({
                    width: 600,
                    height: 600,
                    type: "svg",
                    data: qrUrl,
                    image: "/img/logo-sq.svg",
                    dotsOptions: { color: "#0052FF", type: "rounded" },
                    backgroundOptions: { color: "#ffffff" },
                    imageOptions: { crossOrigin: "anonymous", margin: 12, imageSize: 0.4 },
                    cornersSquareOptions: { type: "extra-rounded", color: "#0052FF" },
                    qrOptions: { errorCorrectionLevel: "H" }
                });

                qrCode.append(container);

                setTimeout(() => {
                    const svg = container.querySelector('svg');
                    if (svg) {
                        svg.style.width = '100%';
                        svg.style.height = 'auto';
                    }
                }, 100);
            }
        };
    </script>
</body>

</html>
