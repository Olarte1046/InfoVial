<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Tu QR Médico</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .success-hero {
            text-align: center;
            padding: 40px 0 24px;
        }

        .icon-check {
            width: 64px;
            height: 64px;
            background: #0052ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 82, 255, 0.3);
        }

        .qr-outer-frame {
            padding: 20px;
            background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 100%);
            border-radius: 40px;
            box-shadow: var(--shadow-strong);
            margin-bottom: 32px;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        :root[data-theme='dark'] .qr-outer-frame {
            background: linear-gradient(135deg, #1a1d23 0%, #2d323c 100%);
        }

        .qr-inner-container {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .qr-code {
            width: 220px;
            height: 220px;
            margin: 0 auto;
        }

        .qr-code img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .id-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #F0F4F8;
            border-radius: 20px;
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
            margin-top: 20px;
            font-size: 14px;
        }

        :root[data-theme='dark'] .id-badge {
            background: #2d323c;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme"></button>
        <div class="success-hero">
            <div class="icon-check"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg></div>
            <h1>¡Todo listo!</h1>
            <p class="description">Tu código QR ha sido vinculado de forma segura.</p>
        </div>

        <div class="qr-outer-frame">
            <div class="qr-inner-container">
                <div class="qr-code"><img id="qr-display" src="" alt="Código QR Médico"></div>
                <div class="id-badge" id="vital-id-display">IDENTIFICANDO...</div>
            </div>
        </div>

        <div class="mt-auto">
            <a id="qr-download" href="#" download="InfoVial-QR.png" class="btn btn-success mb-16"
                style="background-color: #1dbe31;">Guardar Imagen QR</a>
            <a href="dashboard.html" class="btn btn-primary">Ir a mi Panel</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        window.onload = () => {
            const lastId = localStorage.getItem('infovial_last_id');
            const lastSlug = localStorage.getItem('infovial_last_slug');

            if (lastId && lastSlug) {
                document.getElementById('vital-id-display').textContent = InfoVial.maskId(lastId);
                const profileUrl = `${window.location.origin}/u.html?s=${lastSlug}`;
                const temp = document.createElement('div');
                new QRCode(temp, { text: profileUrl, width: 480, height: 480, colorDark: "#121212", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.H });

                setTimeout(() => {
                    const canvas = temp.querySelector('canvas');
                    const qrDataUrl = canvas ? canvas.toDataURL("image/png") : temp.querySelector('img').src;
                    document.getElementById('qr-display').src = qrDataUrl;
                    document.getElementById('qr-download').href = qrDataUrl;
                }, 250);
            } else {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>

</html>
