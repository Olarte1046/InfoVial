<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Perfil de Emergencia</title>
    <link rel="stylesheet" href="/css/main.css">

    <!-- Theme Stabilization Fix -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');

            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute(
                    'data-theme',
                    prefersDark ? 'dark' : 'light'
                );
            }
        })();
    </script>

    <style>
        body {
            background-color: var(--bg-clinical);
        }

        .emergency-btn {
            background: var(--critical);
            color: white;
            padding: 22px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.3);
            margin-bottom: 32px;
            border: none;
            width: 100%;
        }

        .blood-badge {
            background: var(--surface);
            padding: 16px 20px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--border);
            min-width: 100px;
        }

        .blood-type {
            font-size: 40px;
            font-weight: 900;
            color: var(--critical);
            line-height: 1;
        }

        .clinical-card {
            border-left: 6px solid var(--critical);
            padding: 24px;
            background: var(--surface);
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-soft);
        }

        .clinical-item {
            margin-bottom: 20px;
        }

        .clinical-item:last-child {
            margin-bottom: 0;
        }

        .clinical-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .clinical-value {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
        }

        .vial-footer {
            text-align: center;
            padding: 60px 0 40px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div id="error-view"
        style="display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;">
        <h1 style="color: var(--critical);">Perfil no accesible</h1>
        <p class="description">Esta información no existe o es privada por seguridad.</p>
        <a href="/" class="btn btn-outline" style="margin-top: 24px;">Volver al Inicio</a>
    </div>

    <div id="main-view" class="app-container animate-fade">
        <div style="text-align: center; margin: 20px 0 40px;">
            <div
                style="font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">
                Protocolo de Emergencia
            </div>
            <img src="/assets/logo-primary-horizontal.svg" alt="InfoVial" style="height: 28px;">
        </div>

        <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px;">
            <div style="flex: 1;">
                <h1 id="user-name" style="margin-bottom: 4px; font-size: 28px;">Cargando...</h1>
                <p id="user-meta" class="description"
                    style="font-size: 18px; color: var(--text-main); font-weight: 500;">...</p>
            </div>
            <div class="blood-badge">
                <div class="blood-type" id="user-blood">--</div>
                <div class="clinical-label">SANGRE</div>
            </div>
        </header>

        <a id="sos-link" href="#" class="emergency-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                </path>
            </svg>
            LLAMAR CONTACTO SOS
        </a>

        <div class="clinical-card">
            <div class="clinical-item">
                <div class="clinical-label">Alergias / Condiciones</div>
                <div class="clinical-value" id="user-conditions">...</div>
            </div>
            <div style="height: 1px; background: var(--border); margin: 20px 0;"></div>
            <div class="clinical-item">
                <div class="clinical-label">Medicamentos</div>
                <div class="clinical-value" id="user-meds">...</div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Contacto de Emergencia</h2>
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <span class="description">Nombre:</span>
                <span id="user-contact-name" style="font-weight: 700; color: var(--text-main);">...</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span class="description">Parentesco:</span>
                <span id="user-contact-rel" style="font-weight: 700; color: var(--text-main);">...</span>
            </div>
        </div>

        <div class="vial-footer">
            <img src="/assets/logo-icon-only.svg" style="height: 24px; opacity: 0.3; margin-bottom: 12px;">
            <div
                style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">
                InfoVial Sistema de Respuesta
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('s') || urlParams.get('id');

            if (!slug) {
                showError();
                return;
            }

            try {
                const isSlug = slug.length > 15;
                const query = supabaseClient.from('profiles').select('*');

                if (isSlug) {
                    query.eq('public_slug', slug);
                } else {
                    query.eq('vital_id', slug);
                }

                const { data, error } = await query.single();

                if (error || !data) throw new Error('Not found');

                document.getElementById('user-name').textContent = data.nombre;
                document.getElementById('user-meta').textContent =
                    `${data.edad} años • ${data.ciudad || 'Colombia'}`;
                document.getElementById('user-blood').textContent = data.sangre;
                document.getElementById('user-conditions').textContent =
                    data.condiciones || 'Ninguna reportada';
                document.getElementById('user-meds').textContent =
                    data.medicamentos || 'Ninguno';
                document.getElementById('user-contact-name').textContent =
                    data.contacto_nombre;
                document.getElementById('user-contact-rel').textContent =
                    data.contacto_relacion || 'Familiar';

                if (data.telefono_emergencia) {
                    document.getElementById('sos-link').href =
                        `tel:${data.telefono_emergencia}`;
                } else {
                    document.getElementById('sos-link').style.display = 'none';
                }
            } catch (err) {
                showError();
            }
        });

        function showError() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'flex';
        }
    </script>
</body>

</html>
