<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Paso 2</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .check-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-input);
            margin-bottom: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-item.active {
            border-color: var(--primary);
            background: rgba(0, 82, 255, 0.05);
            color: var(--primary);
        }

        .check-item::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            margin-left: auto;
            transition: all 0.2s;
        }

        .check-item.active::after {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: inset 0 0 0 4px white;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme"></button>

        <div class="mb-24" style="display: flex; justify-content: space-between; align-items: center;">
            <span class="label" style="margin: 0;">Paso 2 de 4</span>
            <div
                style="height: 4px; flex: 1; background: var(--border); margin-left: 16px; border-radius: 2px; position: relative; overflow: hidden;">
                <div style="position: absolute; left: 0; top: 0; height: 100%; width: 50%; background: var(--primary);">
                </div>
            </div>
        </div>

        <div class="logo-centered" style="margin-bottom: 24px;">
            <svg width="120" height="32" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <path d="M16 10 L26 36 L36 10" fill="none" stroke="#0052FF" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <polyline points="18,24 22,24 24,18 27,30 30,22 34,24" fill="none" stroke="#2EC4B6" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <text x="52" y="30" font-family="Manrope, sans-serif" font-size="20" font-weight="600"
                    fill="currentColor">Infovial</text>
            </svg>
        </div>

        <h1>Condiciones</h1>
        <p class="description">Selecciona las condiciones médicas que posees actualmente.</p>

        <div class="card" style="padding: 16px;">
            <div class="check-item" onclick="toggleCondition(this)">Diabetes</div>
            <div class="check-item" onclick="toggleCondition(this)">Epilepsia</div>
            <div class="check-item" onclick="toggleCondition(this)">Hipertensión</div>
            <div class="check-item" id="none-opt" onclick="setNone()">Ninguna</div>
            <div class="check-item" id="other-opt" onclick="toggleOther()">Otra...</div>

            <div id="other-input-container" style="display: none; padding-top: 4px;">
                <input type="text" id="other-condition" placeholder="Especifique condición...">
            </div>
        </div>

        <div class="mt-auto">
            <button onclick="InfoVial.backStep()" class="btn btn-back">← Volver</button>
            <button onclick="save()" class="btn btn-primary">Continuar</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const conditions = new Set();
        function toggleCondition(el) {
            const val = el.textContent;
            if (conditions.has(val)) {
                conditions.delete(val);
                el.classList.remove('active');
            } else {
                conditions.add(val);
                el.classList.add('active');
                document.getElementById('none-opt').classList.remove('active');
            }
        }
        function setNone() {
            conditions.clear();
            document.querySelectorAll('.check-item').forEach(el => el.classList.remove('active'));
            document.getElementById('none-opt').classList.add('active');
            document.getElementById('other-input-container').style.display = 'none';
            document.getElementById('other-condition').value = '';
        }

        function toggleOther() {
            const el = document.getElementById('other-opt');
            const container = document.getElementById('other-input-container');
            const input = document.getElementById('other-condition');

            if (el.classList.contains('active')) {
                el.classList.remove('active');
                container.style.display = 'none';
            } else {
                el.classList.add('active');
                container.style.display = 'block';
                input.focus();
                document.getElementById('none-opt').classList.remove('active');
            }
        }

        function save() {
            const list = Array.from(conditions);
            const otherVal = document.getElementById('other-condition').value.trim();
            if (document.getElementById('other-opt').classList.contains('active') && otherVal) {
                list.push(otherVal);
            }

            if (list.length === 0 && !document.getElementById('none-opt').classList.contains('active')) {
                alert('Por favor selecciona al menos una opción');
                return;
            }
            InfoVial.saveData({ condiciones: list });
            InfoVial.nextStep('step3.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.condiciones && data.condiciones.length > 0) {
                const known = ['Diabetes', 'Epilepsia', 'Hipertensión'];
                data.condiciones.forEach(c => {
                    if (known.includes(c)) {
                        conditions.add(c);
                        document.querySelectorAll('.check-item').forEach(el => {
                            if (el.textContent === c) el.classList.add('active');
                        });
                    } else {
                        toggleOther();
                        document.getElementById('other-condition').value = c;
                    }
                });
            } else if (data.condiciones && data.condiciones.length === 0) {
                setNone();
            }
        }
    </script>
</body>

</html>
