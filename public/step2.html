<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVial - Paso 2</title>
    <style>
        :root {
            --primary: #0052FF;
            --text: #1A1C1E;
            --muted: #667085;
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #E4E7EC;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100dvh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 24px;
            font-weight: 700;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 0 24px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .check-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .check-item.active {
            border-color: var(--primary);
            background: #F0F5FF;
            color: var(--primary);
        }

        .footer {
            padding: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="header">PASO 2 DE 4</div>
        <div class="content">
            <h2>Condiciones médicas</h2>
            <div class="check-item" onclick="toggleCondition(this)">Diabetes</div>
            <div class="check-item" onclick="toggleCondition(this)">Epilepsia</div>
            <div class="check-item" onclick="toggleCondition(this)">Hipertensión</div>
            <div class="check-item" id="none-opt" onclick="setNone()">Ninguna</div>
            <div class="check-item" id="other-opt" onclick="toggleOther()">Otra...</div>
            <div id="other-input-container" style="display: none; margin-top: -8px; margin-bottom: 12px;">
                <input type="text" id="other-condition" placeholder="Especifique condición..."
                    style="width: 100%; padding: 16px; border: 2px solid var(--primary); border-radius: var(--radius); font-size: 16px;">
            </div>
        </div>
        <div class="footer"><button onclick="save()" class="btn">Continuar</button></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        const conditions = new Set();
        function toggleCondition(el) {
            const val = el.textContent;
            if (conditions.has(val)) {
                conditions.delete(val);
                el.classList.remove('active');
            } else {
                conditions.add(val);
                el.classList.add('active');
                document.getElementById('none-opt').classList.remove('active');
            }
        }
        function setNone() {
            conditions.clear();
            document.querySelectorAll('.check-item').forEach(el => el.classList.remove('active'));
            document.getElementById('none-opt').classList.add('active');
            document.getElementById('other-input-container').style.display = 'none';
            document.getElementById('other-condition').value = '';
        }

        function toggleOther() {
            const el = document.getElementById('other-opt');
            const container = document.getElementById('other-input-container');
            const input = document.getElementById('other-condition');

            if (el.classList.contains('active')) {
                el.classList.remove('active');
                container.style.display = 'none';
            } else {
                el.classList.add('active');
                container.style.display = 'block';
                input.focus();
                document.getElementById('none-opt').classList.remove('active');
            }
        }

        function save() {
            const list = Array.from(conditions);

            // Add 'Otra' if active
            const otherVal = document.getElementById('other-condition').value.trim();
            if (document.getElementById('other-opt').classList.contains('active') && otherVal) {
                list.push(otherVal);
            }

            if (list.length === 0 && !document.getElementById('none-opt').classList.contains('active')) {
                alert('Por favor selecciona al menos una opción');
                return;
            }
            InfoVial.saveData({ condiciones: list });
            InfoVial.nextStep('step3.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.condiciones && data.condiciones.length > 0) {
                const known = ['Diabetes', 'Epilepsia', 'Hipertensión'];
                data.condiciones.forEach(c => {
                    if (known.includes(c)) {
                        conditions.add(c);
                        document.querySelectorAll('.check-item').forEach(el => {
                            if (el.textContent === c) el.classList.add('active');
                        });
                    } else {
                        // It's 'Otra'
                        toggleOther();
                        document.getElementById('other-condition').value = c;
                    }
                });
            } else if (data.condiciones && data.condiciones.length === 0) {
                setNone();
            }
        }
    </script>
</body>

</html>
