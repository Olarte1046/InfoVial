<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

    <title>InfoVial - Mi Panel</title>

    <link rel="stylesheet" href="/css/main.css">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('infovial_theme');
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            }
        })();
    </script>

    <style>
        .qr-preview-small {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1/1;
            background: white;
            padding: 24px;
            border-radius: 32px;
            margin: 0 auto 32px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-preview-small img,
        .qr-preview-small canvas {
            max-width: 100% !important;
            height: auto !important;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .app-container {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body>

    <div class="app-container" style="padding-top: 0;">

        <header class="dash-header animate-fade">

            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">

                <svg width="130" height="36" viewBox="0 0 170 48" xmlns="http://www.w3.org/2000/svg"
                    style="height:36px;width:auto;">
                    <g>
                        <path d="M4 10 L14 36 L24 10" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <polyline points="6,24 10,24 12,18 15,30 18,22 22,24" fill="none" stroke="rgba(46,196,182,0.9)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </g>
                    <text x="36" y="31" font-family="Manrope, sans-serif" font-size="22" font-weight="800"
                        fill="white">Infovial</text>
                </svg>

                <div style="display:flex;gap:8px;align-items:center;">
                    <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Cambiar tema visual"
                        style="position:static;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <button onclick="Dashboard.logout()"
                        style="background:rgba(0,0,0,0.2);color:white;border:none;padding:6px 14px;border-radius:12px;font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;">
                        Cerrar Sesión
                    </button>
                </div>

            </div>

            <h1 id="dash-name" style="color:white;margin-bottom:4px;">
                Cargando...
            </h1>

            <div id="dash-meta" class="header-meta" style="color:rgba(255,255,255,0.8);font-size:15px;">
                Cargando perfil...
            </div>

            <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;">

                <div class="status-pill">
                    Perfil Activo
                </div>

                <div class="status-pill" style="background:var(--critical);">
                    SANGRE:
                    <span id="dash-blood">...</span>
                </div>

                <div class="status-pill" style="font-family:monospace;">
                    ID:
                    <span id="dash-vial-id">...</span>
                </div>

            </div>
        </header>

        <div class="action-grid animate-fade"
            style="margin-top:-36px;padding:0 4px;position:relative;z-index:20;animation-delay:.1s;">

            <div class="action-card" onclick="Dashboard.openModal('modal-qr')"
                style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:var(--primary-soft);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"
                        stroke-width="2.5">

                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <rect x="7" y="7" width="3" height="3"></rect>
                        <rect x="14" y="7" width="3" height="3"></rect>
                        <rect x="7" y="14" width="3" height="3"></rect>
                        <rect x="14" y="14" width="3" height="3"></rect>

                    </svg>
                </div>

                <span>Mi Identidad</span>
            </div>

            <div class="action-card" onclick="Dashboard.shareProfile()" style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:var(--primary-soft);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"
                        stroke-width="2.5">

                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path>

                    </svg>
                </div>

                <span>Compartir</span>
            </div>

            <div class="action-card" onclick="Dashboard.openModal('modal-edit')"
                style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:var(--primary-soft);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)"
                        stroke-width="2.5">

                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>

                    </svg>
                </div>

                <span>Editar Perfil</span>
            </div>
        </div>

        <!-- Profile Info Card -->
        <div class="card animate-fade" style="margin-top:20px;animation-delay:.15s;">
            <div class="section-header">
                <h2>Mi Perfil Médico</h2>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Nombre</span>
                <span class="value" id="val-nombre">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Edad</span>
                <span class="value" id="val-edad">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">EPS</span>
                <span class="value" id="val-eps">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Condiciones</span>
                <span class="value" id="val-condiciones">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Medicamentos</span>
                <span class="value" id="val-meds">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Contacto SOS</span>
                <span class="value" id="val-contacto">...</span>
            </div>
            <div class="info-row">
                <span class="label" style="margin-bottom:0;">Relación</span>
                <span class="value" id="val-relacion">...</span>
            </div>
            <div class="info-row" style="border-bottom:none;">
                <span class="label" style="margin-bottom:0;">Teléfono SOS</span>
                <span class="value" id="val-tel">...</span>
            </div>
        </div>

        <!-- Vista SOS Button -->
        <div class="animate-fade" style="margin-top:12px;padding:0 4px;animation-delay:.2s;">
            <button id="btn-view-public" class="btn btn-outline"
                style="border-color:var(--critical);color:var(--critical);font-weight:800;font-size:13px;height:50px;gap:10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                Ver Vista SOS Pública
            </button>
        </div>

        <div style="height:60px;"></div>
    </div>

    <!-- QR MODAL -->

    <div id="modal-qr" class="modal-overlay" onclick="Dashboard.closeModal?.('modal-qr')">

        <div class="modal-content glass" onclick="event.stopPropagation()">

            <div class="modal-header">

                <h2>Tu Identidad QR</h2>

                <button class="modal-close" onclick="Dashboard.closeModal?.('modal-qr')">
                    ×
                </button>

            </div>

            <div id="qr-modal-display" class="qr-preview-small">
            </div>

            <div style="text-align:center;margin-bottom:32px;">

                <div class="label">
                    Tu VIAL-ID
                </div>

                <div id="masked-vial-id"
                    style="font-family:monospace;font-weight:800;font-size:18px;color:var(--primary);">
                    ...
                </div>

            </div>

            <a id="qr-modal-download" href="#" class="btn btn-primary" download="InfoVial-QR.png">
                Descargar QR
            </a>
        </div>
    </div>

    <!-- EDIT PROFILE MODAL -->

    <div id="modal-edit" class="modal-overlay" onclick="Dashboard.closeModal?.('modal-edit')">
        <div class="modal-content" onclick="event.stopPropagation()"
            style="max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">

            <div class="modal-header">
                <h2>Editar Perfil</h2>
                <button class="modal-close" onclick="Dashboard.closeModal?.('modal-edit')">×</button>
            </div>

            <form id="edit-profile-form" onsubmit="handleEditProfile(event)">
                <div style="margin-bottom:18px;">
                    <label class="label">Nombre completo</label>
                    <input type="text" id="edit-nombre" placeholder="Nombre completo">
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Edad</label>
                    <input type="number" id="edit-edad" placeholder="Edad" min="0" max="120">
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Grupo Sanguíneo</label>
                    <select id="edit-sangre">
                        <option value="">Seleccionar...</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Condiciones / Alergias</label>
                    <textarea id="edit-condiciones" rows="3"
                        style="min-height:80px;padding:14px;resize:none;"></textarea>
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Medicamentos</label>
                    <textarea id="edit-medicamentos" rows="3"
                        style="min-height:80px;padding:14px;resize:none;"></textarea>
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Contacto de Emergencia</label>
                    <input type="text" id="edit-contacto-nombre" placeholder="Nombre del contacto">
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Relación</label>
                    <input type="text" id="edit-contacto-relacion" placeholder="Ej. Madre, Esposo">
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Teléfono SOS</label>
                    <input type="tel" id="edit-telefono" placeholder="+57 321...">
                </div>
                <div style="margin-bottom:18px;">
                    <label class="label">Ciudad</label>
                    <input type="text" id="edit-ciudad" placeholder="Ej. Medellín">
                </div>
                <div style="margin-bottom:24px;">
                    <label class="label">EPS / Seguro</label>
                    <input type="text" id="edit-eps" placeholder="Ej. Sura, Sanitas">
                </div>

                <button type="submit" class="btn btn-primary" id="edit-save-btn">Guardar Cambios</button>
                <button type="button" onclick="Dashboard.closeModal('modal-edit')" class="btn btn-outline"
                    style="margin-top:10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="/js/app.js"></script>

    <script>
        // Global reference for QR
        let currentQRCode = null;

        async function renderQrModal() {
            if (!Dashboard.profile) {
                console.error("QR Error: No Profile");
                return;
            }

            const container = document.getElementById('qr-modal-display');
            if (!container) {
                console.error("QR Error: No Container Found");
                return;
            }
            container.innerHTML = 'Cargando QR...';

            const profileUrl = `${window.location.origin}/u.html?s=${Dashboard.profile.public_slug}`;
            console.log("Rendering QR for:", profileUrl);

            try {
                currentQRCode = new QRCodeStyling({
                    width: 500,
                    height: 500,
                    type: "canvas", // Change to canvas for max compatibility
                    data: profileUrl,
                    image: "/img/logo-sq.svg",
                    dotsOptions: { color: "#0052FF", type: "rounded" },
                    backgroundOptions: { color: "#ffffff" },
                    imageOptions: { crossOrigin: "anonymous", margin: 10, imageSize: 0.4 },
                    cornersSquareOptions: { type: "extra-rounded", color: "#0052FF" },
                    qrOptions: { errorCorrectionLevel: "H" }
                });

                container.innerHTML = '';
                await currentQRCode.append(container);
                console.log("QR successfully appended to DOM");

                const canvas = container.querySelector('canvas');
                if (canvas) {
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.display = 'block';
                }
            } catch (err) {
                console.error("QR Generation Failed:", err);
                container.innerHTML = '<p style="color:red; font-size:12px;">Error al generar QR. Por favor recarga.</p>';
            }
        }

        // Handle download button separately to ensure currentQRCode is ready
        document.getElementById('qr-modal-download').addEventListener('click', (e) => {
            e.preventDefault();
            if (currentQRCode) {
                console.log("Downloading QR...");
                const name = (Dashboard.profile?.nombre || 'vial-id').replace(/\s+/g, '-');
                currentQRCode.download({ name: `InfoVial-QR-${name}`, extension: "png" });
            } else {
                console.error("QR not generated yet");
            }
        });

        function populateEditForm() {
            const p = Dashboard.profile;
            if (!p) return;
            document.getElementById('edit-nombre').value = p.nombre || '';
            document.getElementById('edit-edad').value = p.edad || '';
            document.getElementById('edit-sangre').value = p.sangre || '';
            document.getElementById('edit-condiciones').value = p.condiciones || '';
            document.getElementById('edit-medicamentos').value = p.medicamentos || '';
            document.getElementById('edit-contacto-nombre').value = p.contacto_nombre || '';
            document.getElementById('edit-contacto-relacion').value = p.contacto_relacion || '';
            document.getElementById('edit-telefono').value = p.telefono_emergencia || '';
            document.getElementById('edit-ciudad').value = p.ciudad || '';
            document.getElementById('edit-eps').value = p.eps || '';
        }

        async function handleEditProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('edit-save-btn');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                await Dashboard.updateProfile({
                    nombre: document.getElementById('edit-nombre').value,
                    edad: document.getElementById('edit-edad').value || null,
                    sangre: document.getElementById('edit-sangre').value,
                    condiciones: document.getElementById('edit-condiciones').value,
                    medicamentos: document.getElementById('edit-medicamentos').value,
                    contacto_nombre: document.getElementById('edit-contacto-nombre').value,
                    contacto_relacion: document.getElementById('edit-contacto-relacion').value,
                    telefono_emergencia: document.getElementById('edit-telefono').value,
                    ciudad: document.getElementById('edit-ciudad').value,
                    eps: document.getElementById('edit-eps').value
                });

                Dashboard.closeModal('modal-edit');
            } catch (err) {
                console.error('Edit error:', err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar Cambios';
            }
        }

        // Initialize dashboard bridge
        window.addEventListener('load', async () => {
            try {
                // Ensure app.js theme init
                if (typeof InfoVial !== 'undefined') InfoVial.initTheme();

                // Override modal logic to trigger QR generation
                const originalOpen = Dashboard.openModal;
                Dashboard.openModal = function (id) {
                    if (typeof originalOpen === 'function') originalOpen.call(Dashboard, id);
                    else {
                        const el = document.getElementById(id);
                        if (el) el.style.display = 'flex';
                    }

                    if (id === 'modal-qr') setTimeout(renderQrModal, 50);
                    if (id === 'modal-edit') populateEditForm();
                };

                // SOS Button click
                const sosBtn = document.getElementById('btn-view-public');
                if (sosBtn) {
                    sosBtn.onclick = () => {
                        if (Dashboard.profile?.public_slug) {
                            window.location.href = `/u.html?s=${Dashboard.profile.public_slug}`;
                        }
                    };
                }

            } catch (err) {
                console.error('Bridge Error:', err);
            }
        });
    </script>

</body>

</html>
