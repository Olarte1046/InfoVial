<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

    <title>InfoVial - Mi Panel</title>

    <link rel="stylesheet" href="/css/main.css">

    <style>
        .qr-preview-small {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1/1;
            background: white;
            padding: 24px;
            border-radius: 32px;
            margin: 0 auto 32px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-preview-small img,
        .qr-preview-small canvas {
            max-width: 100% !important;
            height: auto !important;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .app-container {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>

<body>

    <div class="app-container" style="padding-top: 0;">

        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Cambiar tema visual">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

            </svg>
        </button>

        <header class="dash-header animate-fade">

            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">

                <img src="/assets/logo-icon-only.svg" alt="InfoVial" style="height:32px;filter:brightness(0) invert(1);"
                    onerror="this.src='/logo-icon-only.svg'">

                <button onclick="Dashboard.logout()"
                    style="background:rgba(0,0,0,0.2);color:white;border:none;padding:6px 14px;border-radius:12px;font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;">
                    Cerrar Sesión
                </button>

            </div>

            <h1 id="dash-name" style="color:white;margin-bottom:4px;">
                Cargando...
            </h1>

            <div id="dash-meta" class="header-meta" style="color:rgba(255,255,255,0.8);font-size:15px;">
                Cargando perfil...
            </div>

            <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;">

                <div class="status-pill">
                    Perfil Activo
                </div>

                <div class="status-pill" style="background:var(--critical);">
                    SANGRE:
                    <span id="dash-blood">...</span>
                </div>

                <div class="status-pill" style="font-family:monospace;">
                    ID:
                    <span id="dash-vial-id">...</span>
                </div>

            </div>
        </header>

        <div class="action-grid animate-fade"
            style="margin-top:-36px;padding:0 4px;position:relative;z-index:20;animation-delay:.1s;">

            <div class="action-card" onclick="Dashboard.openModal('modal-qr')"
                style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:var(--primary-soft);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">

                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <rect x="7" y="7" width="3" height="3"></rect>
                        <rect x="14" y="7" width="3" height="3"></rect>
                        <rect x="7" y="14" width="3" height="3"></rect>
                        <rect x="14" y="14" width="3" height="3"></rect>

                    </svg>
                </div>

                <span>Mi Identidad</span>
            </div>

            <div class="action-card" onclick="Dashboard.shareProfile()" style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:var(--primary-soft);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">

                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path>

                    </svg>
                </div>

                <span>Compartir</span>
            </div>

            <div id="btn-view-public" class="action-card" style="box-shadow:0 10px 25px rgba(0,0,0,.08);">

                <div style="background:rgba(230,57,70,.05);padding:12px;border-radius:16px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--critical)"
                        stroke-width="2.5">

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>

                    </svg>
                </div>

                <span style="color:var(--critical);">
                    Vista SOS
                </span>
            </div>
        </div>

        <div style="height:60px;"></div>
    </div>

    <!-- QR MODAL -->

    <div id="modal-qr" class="modal-overlay" onclick="Dashboard.closeModal?.('modal-qr')">

        <div class="modal-content glass" onclick="event.stopPropagation()">

            <div class="modal-header">

                <h2>Tu Identidad QR</h2>

                <button class="modal-close" onclick="Dashboard.closeModal?.('modal-qr')">
                    ×
                </button>

            </div>

            <div id="qr-modal-display" class="qr-preview-small">
            </div>

            <div style="text-align:center;margin-bottom:32px;">

                <div class="label">
                    Tu VIAL-ID
                </div>

                <div id="masked-vial-id"
                    style="font-family:monospace;font-weight:800;font-size:18px;color:var(--primary);">
                    ...
                </div>

            </div>

            <a id="qr-modal-download" href="#" class="btn btn-primary" download="InfoVial-QR.png">
                Descargar QR
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="/js/app.js" defer></script>

    <script>

        async function renderQrModal() {

            if (!Dashboard.profile) return;

            const container =
                document.getElementById('qr-modal-display');

            container.innerHTML = '';

            const profileUrl =
                `${window.location.origin}/u.html?s=${Dashboard.profile.public_slug}`;

            new QRCode(container, {
                text: profileUrl,
                width: 512,
                height: 512,
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {

                const canvas =
                    container.querySelector('canvas');

                if (!canvas) return;

                canvas.style.width = '100%';
                canvas.style.height = 'auto';

                document.getElementById('qr-modal-download')
                    .onclick = (e) => {
                        e.preventDefault();

                        const link =
                            document.createElement('a');

                        link.download =
                            `InfoVial-QR-${(Dashboard.profile.nombre || 'perfil')
                                .replace(/\s+/g, '-')}.png`;

                        link.href =
                            canvas.toDataURL('image/png');

                        link.click();
                    };

            }, 300);
        }

        document.addEventListener('DOMContentLoaded', async () => {

            try {

                InfoVial.initTheme();

                if (typeof Dashboard !== 'undefined') {
                    await Dashboard.init();
                }

                const originalOpen =
                    Dashboard.openModal?.bind(Dashboard);

                Dashboard.openModal = function (id) {

                    originalOpen?.(id);

                    if (id === 'modal-qr') {
                        renderQrModal();
                    }
                };

                document.getElementById('btn-view-public')
                    .onclick = () => {

                        if (!Dashboard.profile?.public_slug)
                            return;

                        window.location.href =
                            `/u.html?s=${Dashboard.profile.public_slug}`;
                    };

            } catch (err) {

                console.error('Dashboard Error:', err);

                document.getElementById('dash-name')
                    .textContent = 'Error al cargar';

                document.getElementById('dash-meta')
                    .textContent =
                    'Recarga la página';
            }
        });

    </script>

</body>

</html>
