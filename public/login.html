<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Acceso Seguro</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-clinical);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .auth-tab {
            padding: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div class="logo-box animate-fade" style="margin-top: 40px;">
            <img src="/assets/logo-primary-horizontal.svg" alt="InfoVial" class="logo-main">
        </div>

        <div class="animate-fade" style="animation-delay: 0.1s;">
            <div class="card" style="padding: 32px;">
                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="switchTab('login')">Ingresar</div>
                    <div class="auth-tab" onclick="switchTab('signup')">Crear Perfil</div>
                </div>

                <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                    <h2>Bienvenido de vuelta</h2>
                    <p class="description" style="margin-bottom: 24px; font-size: 14px;">Ingresa para gestionar tu
                        identidad médica.</p>
                    <div style="margin-bottom: 16px;">
                        <label class="label">Email</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label class="label">Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>

                <form id="signup-form" class="auth-form" onsubmit="handleAuth(event, 'signup')">
                    <h2>Únete a InfoVial</h2>
                    <p class="description" style="margin-bottom: 24px; font-size: 14px;">Protege tu salud con tecnología
                        de vanguardia.</p>
                    <div style="margin-bottom: 16px;">
                        <label class="label">Email</label>
                        <input type="email" id="signup-email" placeholder="tu@email.com" required>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label class="label">Contraseña</label>
                        <input type="password" id="signup-password" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>

                <div style="text-align: right; margin-top: 12px;">
                    <a href="password-reset.html"
                        style="font-size: 12px; color: var(--text-muted); text-decoration: none;">¿Olvidaste tu
                        contraseña?</a>
                </div>
                <div id="auth-error"
                    style="color: var(--critical); font-size: 14px; margin-top: 16px; text-align: center; display: none;">
                </div>
            </div>

            <p style="text-align: center; margin-top: 32px;"><a href="index.html"
                    style="color: var(--text-muted); font-size: 14px; text-decoration: none;">← Volver al inicio</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function switchTab(type) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().includes(type === 'login' ? 'ingresar' : 'crear')));
            document.getElementById('login-form').classList.toggle('active', type === 'login');
            document.getElementById('signup-form').classList.toggle('active', type === 'signup');
            document.getElementById('auth-error').style.display = 'none';
        }

        async function handleAuth(e, type) {
            e.preventDefault();
            const email = document.getElementById(`${type}-email`).value;
            const password = document.getElementById(`${type}-password`).value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.style.display = 'none';

            try {
                let result;
                if (type === 'login') {
                    result = await supabaseClient.auth.signInWithPassword({ email, password });
                } else {
                    result = await supabaseClient.auth.signUp({ email, password });
                }

                if (result.error) throw result.error;

                if (type === 'signup' && !result.data.session) {
                    alert('Registro exitoso. Por favor revisa tu email para confirmar la cuenta.');
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>

</html>
