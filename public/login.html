<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InfoVial - Acceso Seguro</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-container {
            padding: 40px 24px;
            max-width: 420px;
            margin: 0 auto;
        }

        .magic-status {
            display: none;
            text-align: center;
            padding: 24px;
            background: var(--primary-soft);
            border-radius: 20px;
            margin-top: 24px;
            animation: fadeIn 0.4s ease;
        }

        .magic-status h3 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .magic-status p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <button class="theme-toggle" onclick="InfoVial.toggleTheme()" aria-label="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div class="logo-box animate-fade" style="margin-top: 60px;">
            <img src="/assets/logo-primary-horizontal.svg" alt="InfoVial" class="logo-main">
        </div>

        <div class="animate-fade" id="auth-main" style="animation-delay: 0.1s;">
            <div class="card" style="padding: 32px; border: none; box-shadow: var(--shadow-premium);">
                <h2 style="margin-bottom: 8px;">Acceso sin contraseña</h2>
                <p class="description" style="margin-bottom: 32px; font-size: 15px;">Ingresa tu email para recibir un
                    enlace mágico de acceso instantáneo.</p>

                <form id="magic-form" onsubmit="handleMagicLink(event)">
                    <div style="margin-bottom: 24px;">
                        <label class="label">Email de tu cuenta</label>
                        <input type="email" id="magic-email" placeholder="tu@email.com" required
                            style="font-size: 16px; padding: 14px 18px;">
                    </div>

                    <button type="submit" id="magic-btn" class="btn btn-primary"
                        style="height: 54px; font-size: 16px;">Enviar enlace de acceso</button>

                    <div id="auth-error"
                        style="color: var(--critical); font-size: 14px; margin-top: 20px; text-align: center; display: none; font-weight: 600;">
                    </div>
                </form>
            </div>

            <p style="text-align: center; margin-top: 40px;">
                <a href="index.html"
                    style="color: var(--text-muted); font-size: 14px; text-decoration: none; font-weight: 600;">← Volver
                    al inicio</a>
            </p>
        </div>

        <div id="magic-sent" class="magic-status">
            <div style="font-size: 40px; margin-bottom: 16px;">✉️</div>
            <h3>¡Enlace enviado!</h3>
            <p>Hemos enviado un enlace de acceso a <strong id="sent-email-display">...</strong>.<br>Revisa tu bandeja de
                entrada (y spam) para ingresar.</p>
            <button onclick="location.reload()" class="btn btn-outline"
                style="margin-top: 24px; border: none; font-weight: 800; font-size: 13px;">Volver a intentar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script>
        async function handleMagicLink(e) {
            e.preventDefault();
            const email = document.getElementById('magic-email').value;
            const btn = document.getElementById('magic-btn');
            const errorDiv = document.getElementById('auth-error');

            btn.disabled = true;
            btn.innerText = 'Enviando...';
            errorDiv.style.display = 'none';

            try {

                const { error } =
                    await supabaseClient.auth.signInWithOtp({
                        email: email,
                        options: {
                            emailRedirectTo:
                                'https://infovial.app/dashboard.html?action=complete_registration'
                        }
                    });

                if (error) throw error;

                document.getElementById('auth-main')
                    .style.display = 'none';

                document.getElementById('sent-email-display')
                    .textContent = email;

                document.getElementById('magic-sent')
                    .style.display = 'block';

            } catch (err) {

                errorDiv.textContent =
                    err.message;

                errorDiv.style.display =
                    'block';

                btn.disabled = false;

                btn.innerText =
                    'Enviar enlace de acceso';
            }
        }
    </script>
</body>

</html>
