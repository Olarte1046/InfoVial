<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVial - Paso 3</title>
    <style>
        :root {
            --primary: #12324A;
            --primary-night: #0E2235;
            --text: #0F1720;
            --muted: #5F6368;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #D8E0E7;
            --shadow: 0 4px 12px rgba(18, 50, 74, 0.05);
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100dvh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 24px;
            font-weight: 700;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 0 24px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            color: var(--muted);
            margin-bottom: 32px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 17px;
            font-family: inherit;
            resize: none;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.9);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(18, 50, 74, 0.1);
        }

        .check-item-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .check-item-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .check-item-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #F0F5FF;
        }

        .footer {
            padding: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="header">PASO 3 DE 4</div>
        <div class="content">
            <h2>Medicamentos</h2>
            <p>Indica si tomas algún medicamento de forma diaria o recurrente.</p>
            <textarea id="medicamentos" placeholder="Ej. Insulina diaria 20mg, Losartán..."></textarea>

            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button type="button" onclick="setNoMeds()" class="check-item-btn">Ninguno</button>
            </div>
        </div>
        <div class="footer"><button onclick="save()" class="btn">Continuar</button></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        function setNoMeds() {
            document.getElementById('medicamentos').value = 'Ninguno';
            document.getElementById('medicamentos').focus();
        }

        function save() {
            const meds = document.getElementById('medicamentos').value.trim();
            if (!meds) {
                alert('Si no toma medicamentos, escriba "Ninguno" o presione el botón.');
                return;
            }
            InfoVial.saveData({ medicamentos: meds });
            InfoVial.nextStep('step4.html');
        }
        window.onload = () => {
            const data = InfoVial.getData();
            if (data.medicamentos) document.getElementById('medicamentos').value = data.medicamentos;
        }
    </script>
</body>

</html>
