<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoVital - Paso 3</title>
    <style>
        :root {
            --primary: #0052FF;
            --text: #1A1C1E;
            --muted: #667085;
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --radius: 16px;
            --border: #E4E7EC;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .iphone {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 24px;
            font-weight: 700;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            flex: 1;
            padding: 0 24px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            color: var(--muted);
            margin-bottom: 32px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            font-family: inherit;
            resize: none;
        }

        .footer {
            padding: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="iphone">
        <div class="header">PASO 3 DE 4</div>
        <div class="content">
            <h2>Medicamentos</h2>
            <p>Indica si tomas algún medicamento de forma diaria o recurrente.</p>
            <textarea id="medicamentos" placeholder="Ej. Insulina diaria 20mg, Losartán..."></textarea>
        </div>
        <div class="footer"><button onclick="save()" class="btn">Continuar</button></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        function save() {
            const meds = document.getElementById('medicamentos').value;
            InfoVital.saveData({ medicamentos: meds });
            InfoVital.nextStep('step4.html');
        }
        window.onload = () => {
            const data = InfoVital.getData();
            if (data.medicamentos) document.getElementById('medicamentos').value = data.medicamentos;
        }
    </script>
</body>

</html>
